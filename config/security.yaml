detection:
  fps: 10
  confidence_min: 0.5
  # pixels_per_meter: キャリブレーション値が未確定の場合は null にする。
  # null の場合、距離はピクセル距離のまま扱われる。
  pixels_per_meter: null
  target_classes:
    person: [0]
    vehicle: [2, 3, 5, 7]

trigger:
  distance_threshold_m: 3.0    # pixels_per_meter が設定済みのときのメートル閾値
  distance_threshold_px: 200   # pixels_per_meter が null のときのピクセル閾値（未キャリブ時）
  stay_duration_sec: 2.0

owner_exclusion:
  proximity_threshold_m: 1.5  # 未キャリブ時はピクセル距離
  detection_window_sec: 10.0  # 車両到着後の検出ウィンドウ
  exclusion_duration_sec: 300.0  # 除外継続時間 (sec)

scoring:
  threshold: 70
  # 夜間帯: 22:00〜05:59 (end は非含)
  night_start_hour: 22
  night_end_hour: 6
  # 薄暮帯1: 18:00〜21:59
  twilight1_start_hour: 18
  twilight1_end_hour: 22
  # 薄暮帯2: 05:00〜06:59
  twilight2_start_hour: 5
  twilight2_end_hour: 7
  # 過去 N 時間以内の不審イベントで +10
  recent_event_window_hours: 24

behavior_scores:
  forced_entry_attempt: 60
  vandalism: 50
  tampering: 45
  peering: 30
  approach_fast: 25
  circling: 15
  stay_near_vehicle: 10
  unknown_behavior: 5

labels:
  - forced_entry_attempt
  - vandalism
  - tampering
  - peering
  - approach_fast
  - circling
  - stay_near_vehicle
  - unknown_behavior

vlm_prompt_template: |
  Please review the video and select the most appropriate label for the behavior of the person in the video from the candidates below.
  If none apply, select unknown_behavior.

  Label Candidates:
  - forced_entry_attempt : Attempted unauthorized entry such as breaking windows or forcing doors open
  - vandalism            : Damaging the vehicle (scratching, kicking, etc.)
  - tampering            : Touching or attempting to operate doors, handles, or keyholes
  - peering              : Peering into the vehicle
  - approach_fast        : Approaching or running towards the vehicle rapidly
  - circling             : Circling around the vehicle
  - stay_near_vehicle    : Loitering or staying near the vehicle for a long time
  - unknown_behavior     : None of the above apply

  Output format (JSON only. Do not include any other text):
  {"label": "<label>", "reason": "<reason in one sentence>"}
